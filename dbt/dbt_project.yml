# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'energy_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'energy_analytics'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"
  - "logs"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  energy_analytics:
    # Staging models - Clean and type raw data
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]

    # Intermediate models - Business logic and joins
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]

    # Marts models - Analytics-ready fact and dimension tables
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

# Variables for the project
vars:
  # Date ranges for incremental models
  start_date: '2020-01-01'

  # Energy source categories
  renewable_sources: ['solar', 'wind', 'hydro']
  fossil_sources: ['coal', 'natural_gas']

  # Data quality thresholds
  min_value_threshold: 0
  max_temperature_f: 150
  min_temperature_f: -50

# Seeds configuration
seeds:
  energy_analytics:
    +schema: raw
    +quote_columns: false

# Snapshots configuration
snapshots:
  energy_analytics:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at
