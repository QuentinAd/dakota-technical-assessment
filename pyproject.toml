[project]
name = "dakota-analytics"
version = "0.1.0"
description = "Data Engineering Technical Assessment - End-to-end data pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastAPI and web framework
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    # Linting and formatting
    "ruff>=0.7.0",
    
    # Testing
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    
    # Development tools
    "ipython>=8.28.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ingestion", "orchestration", "reports"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [  
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
]
